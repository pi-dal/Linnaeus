name: Website

on:
  pull_request:
    paths:
      - "site/**"
      - "docs/**"
      - "README.md"
      - "PRODUCT.md"
      - "DESIGN.md"
      - ".github/workflows/website.yml"
  push:
    branches: [main]
    paths:
      - "site/**"
      - "docs/**"
      - "README.md"
      - "PRODUCT.md"
      - "DESIGN.md"
      - ".github/workflows/website.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v3
      - name: Build site (Pages serves under /<repo>/)
        env:
          NUXT_APP_BASE_URL: /
        run: mise run site
      - uses: actions/upload-pages-artifact@v4
        with:
          path: site/.output/public

  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    concurrency:
      group: github-pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
