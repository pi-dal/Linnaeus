name: Quality

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v3
      - run: mise run sync-quality
      - run: mise run lint
      - run: mise run build

  tests:
    runs-on: ubuntu-24.04
    env:
      HF_HUB_OFFLINE: "1"
      TRANSFORMERS_OFFLINE: "1"
    steps:
      - uses: actions/checkout@v7
      - name: Make room for the locked CUDA runtime
        # Torch alone occupies about 14 GiB; these SDKs are unused by this job.
        run: sudo rm -rf /usr/local/lib/android /usr/share/dotnet
      - uses: jdx/mise-action@v3
      - run: mise run install
      - run: uv run --no-sync ty check src
      - name: Run pytest
        run: mise run test
