[build-system]
requires = ["uv_build>=0.8,<0.9"]
build-backend = "uv_build"

[project]
name = "linnaeus"
version = "0.1.0"
readme = "README.md"
description = "Linnaeus: NVIDIA-optimized small multimodal models for direct decisions."
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
requires-python = ">=3.12,<3.15"
dependencies = [
  # Pinned to the recorded upstream runtime (2.9.1 / 0.24.x); the CUDA build
  # comes from the pytorch-cu128 index bound below.
  "torch==2.9.1",
  "torchvision==0.24.1",
  "transformers>=5.17,<5.18",
  "peft>=0.21,<0.22",
  "Pillow>=11",
  "huggingface-hub>=1.0,<2",
  # Triton has no macOS wheels; FLA is imported lazily inside kernel functions,
  # so the package still installs and CPU tests run on macOS without it.
  "flash-linear-attention==0.5.2; sys_platform == 'linux'",
]

[project.optional-dependencies]
train = ["pyarrow>=25", "scikit-learn>=1.9", "pandas>=3.0", "datasets>=4"]
# Optional speed-up, intentionally not a hard dependency: install `hf-transfer`
# on the training host and run_experiment enables HF_HUB_ENABLE_HF_TRANSFER
# automatically for the multi-GB dataset/model pulls.
# NVML board telemetry on NVIDIA hosts; without it Sampler still records RSS.
telemetry = ["nvidia-ml-py>=12"]
agent = ["bub @ git+https://github.com/bubbuild/bub.git@9bf70488e22a44eeb875a9d55d9a7d352b82e381"]
# On-device inference on Apple Silicon (macOS + iOS exports). Darwin only —
# mlx has no Linux wheels for the VLM path; keep it out of the CUDA runtime.
mlx = ["mlx-lm>=0.31", "mlx-vlm>=0.7; sys_platform == 'darwin'"]

[dependency-groups]
quality = ["ruff==0.16.8", "ty==0.0.82", "prek>=0.3.1,<1", "pytest>=9,<10"]
docs = ["sphinx==9.1.0", "furo==2025.12.19", "myst-parser==5.1.0"]
plot = ["matplotlib==3.11.2", "numpy==2.5.3"]

[project.urls]
Models = "https://huggingface.co/pi-dal/Linnaeus-0.1.0-2B"

[tool.uv]
package = true
# Linux x86_64/aarch64 get the +cu128 CUDA wheels; macOS gets PyPI builds for
# local CPU-only development (lint, typecheck, tests). Training/inference
# still requires a CUDA host.
required-environments = [
  "sys_platform == 'linux'",
  "sys_platform == 'darwin'",
]

[tool.uv.build-backend]
module-name = "linnaeus"
module-root = "src"

[tool.uv.sources]
torch = [{ index = "pytorch-cu128", marker = "sys_platform == 'linux'" }]
torchvision = [{ index = "pytorch-cu128", marker = "sys_platform == 'linux'" }]

# NVIDIA runtime: torch/torchvision resolve as +cu128 builds from the official
# PyTorch index. Switch cu128 to another toolkit index (e.g. cu126/cu130) if the
# host driver requires it.
[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["--strict-config", "--strict-markers"]

[tool.ty.rules]
# fla is a Linux-only dependency; its ty: ignore comments in kernels.py are
# platform-conditional by design, so unused-ignore noise is expected.
unused-ignore-comment = "ignore"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B", "PT"]
# Keep existing zip truncation semantics; review strictness at each call site.
ignore = ["B905"]
