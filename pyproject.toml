[build-system]
requires = ["pdm-backend>=2.4,<3"]
build-backend = "pdm.backend"

[project]
name = "linnaeus"
version = "0.1.0"
readme = "README.md"
description = "NVIDIA-optimized fork of Dohnuts: small multimodal models for direct decisions."
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
requires-python = ">=3.12"
dependencies = [
  "torch>=2.9",
  "torchvision>=0.24",
  "transformers>=5.17,<5.18",
  "peft>=0.21,<0.22",
  "Pillow>=11",
  "huggingface-hub>=1.0,<2",
  "flash-linear-attention==0.5.2",
]

[project.optional-dependencies]
train = ["pyarrow>=25", "scikit-learn>=1.9", "pandas>=3.0", "datasets>=4"]
agent = ["bub @ git+https://github.com/bubbuild/bub.git@9bf70488e22a44eeb875a9d55d9a7d352b82e381"]

[dependency-groups]
quality = ["ruff==0.16.8", "ty==0.0.82", "prek>=0.3.1,<1", "pytest>=9,<10"]
docs = ["sphinx==9.1.0", "furo==2025.12.19", "myst-parser==5.1.0"]
plot = ["matplotlib==3.11.2", "numpy==2.5.3"]

[project.urls]
Upstream = "https://github.com/PsiACE/dohnuts"
Models = "https://huggingface.co/PsiACE/Dohnuts-0.1.0-0.8B"

[tool.pdm]
distribution = true
requires-pdm = ">=2.29.2,<3"

[tool.pdm.build]
package-dir = "src"
includes = ["src/dohnuts"]
source-includes = [
  "tests", "scripts", "docs", "results", "assets/dohnuts-logo.png",
  "MODEL_CARD.md", "index.md", "Makefile", "NOTICE", "pdm.lock", "pdm.toml",
  ".python-version", ".pre-commit-config.yaml",
]

# NVIDIA runtime: torch/torchvision resolve from PyPI, whose Linux x86_64 wheels
# ship CUDA + Triton. Pin an explicit CUDA index here if a specific toolkit is
# required, e.g. https://download.pytorch.org/whl/cu128.

[tool.pdm.scripts]
lint = "ruff check ."
format = "ruff format ."
format-check = "ruff format --check ."
typecheck = "ty check src"
check = { composite = ["lint", "format-check", "typecheck"] }
test = "pytest"
docs = "sphinx-build -b html -W --keep-going -d build/doctrees -c docs . build/site"
docs-serve = "python -m http.server 8000 --bind 127.0.0.1 --directory build/site"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["--strict-config", "--strict-markers"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B", "PT"]
# Keep existing zip truncation semantics; review strictness at each call site.
ignore = ["B905"]
